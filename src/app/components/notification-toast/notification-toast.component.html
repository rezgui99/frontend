<div [class]="getToastClass()">
  <div class="flex items-start">
    <div class="flex-shrink-0">
      <span class="text-lg">{{ getIcon() }}</span>
    </div>
    <div class="ml-3 flex-1">
      <p class="text-sm font-medium">{{ notification.title }}</p>
      <p class="text-sm mt-1">{{ notification.message }}</p>
      
      <!-- Actions -->
      <div *ngIf="notification.actions && notification.actions.length > 0" 
           class="mt-3 flex space-x-2">
        <button *ngFor="let action of notification.actions" 
                (click)="executeAction(action.action)"
                class="px-2 py-1 rounded text-xs font-medium transition-colors duration-150"
                [class]="getActionButtonClass(action.style || 'primary')">
          {{ action.label }}
        </button>
      </div>
    </div>
    <button (click)="close()" 
            class="ml-4 text-gray-400 hover:text-gray-600 transition-colors duration-150">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
  </div>
</div>
