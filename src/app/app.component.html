<div class="flex h-screen bg-light">
  <!-- Sidebar -->
  <app-sidebar *ngIf="showSidebar" class="transition-transform duration-300"></app-sidebar>

  <!-- Main content -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- Header with notifications -->
    <header class="bg-white shadow-sm border-b border-gray-200 px-6 py-4" *ngIf="showSidebar">
      <div class="flex items-center justify-between">
        <h1 class="text-xl font-semibold text-gray-900">{{ getPageTitle() }}</h1>
        <div class="flex items-center space-x-4">
          <app-notification-center></app-notification-center>
          <app-gpec-alert-widget></app-gpec-alert-widget>
        </div>
      </div>
    </header>

    <!-- Page content -->
    <main class="flex-1 overflow-x-hidden overflow-y-auto bg-light p-6">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
